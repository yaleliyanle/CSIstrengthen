# Multifactor development configuration: estimate on training history and evaluate NAV over validation only.
# Compare and freeze methods before explicitly enabling the out-of-sample interval via the CLI.

[data]
engine = "duckdb"
batch_size = 16
duckdb_threads = 4
market = "a share/A股行情数据.parquet"
valuation = "a share/A股估值数据.parquet"
industry = "a share/A股行业分类.parquet"
index_members = "a share/指数成分股.parquet"
factor_root = "factor"

[research]
start = "2014-10-31"
end = "2020-10-31"              # Defaults to the last validation date
benchmark = "000852.SH"
membership_lag = 0

# factor_file supplies the frozen factor list; the entry here is a fallback for configuration validation.
[[factors]]
source = "基本面因子"
name = "ep_qr_sud"

[preprocess]
winsor_lower = 0.01
winsor_upper = 0.99
standardize = "zscore"
neutralize_industry = true
neutralize_size = true
missing = "renormalize"
min_factor_count = 1

[multifactor]
method = "max_ic_ir"             # equal / max_ic_ir / max_ic / module:function
factor_file = "configs/csi1000_selected_32.csv"
estimation_universe = "all_a"    # Estimate IC and risk matrices on all A-shares
lookback_periods = 12
group_by_source = true            # Optimize within categories and weight categories equally
exposure_shrinkage = 0.1          # Exposure correlation-matrix shrinkage for max_ic
eigenvalue_floor = 1e-8
optimizer_tolerance = 1e-9
optimizer_max_iterations = 1000
backtest_start = "2019-05-01"    # Defaults to evaluating NAV over validation only

[schedule]
method = "monthly"                # weekly / monthly

[portfolio]
method = "benchmark_tilt"         # Replace with top_n_equal / top_n_benchmark / module:function
empty_signal = "error"
top_n = 100
tilt = 0.35
score_clip = 3.0
max_weight = 0.02

[execution]
price = "next_open"
initial_cash = 100000000.0
record_positions = true
allow_same_close = false

[rules]
profile = "custom"
block_suspended = true
block_limit = false
use_eod_limit_for_open = false
t_plus_one = true

[costs]
commission_rate = 0.001            # Charge 0.1% on each buy and sell
minimum_commission = 0.0
stamp_tax = "none"                 # The uniform 0.1% one-way rate already covers costs; do not charge stamp duty again
transfer_fee = "none"

[analytics]
annual_days = 252
risk_free_rate = 0.0

[charts]
enabled = true
width = 1100
height = 500

[output]
directory = "outputs/csi1000_multifactor"
