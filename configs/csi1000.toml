# All options can be overridden from the command line, for example:
# ashare-lab backtest --config configs/csi1000.toml --execution same_close

[data]
engine = "polars"             # polars / duckdb; changes the data backend only, preserving research semantics
batch_size = 16               # Number of factors per DuckDB batch
duckdb_threads = 4            # Number of DuckDB query threads
market = "a share/A股行情数据.parquet"
valuation = "a share/A股估值数据.parquet"
industry = "a share/A股行业分类.parquet"
index_members = "a share/指数成分股.parquet"
factor_root = "factor"

[research]
start = "2014-10-31"
end = "2025-12-30"
benchmark = "000852.SH"
membership_lag = 0             # Extra trading-day lag for constituent snapshots; use 1 for a conservative assumption

# direction=-1 favors lower values; availability_lag counts trading days until information is available.
[[factors]]
source = "基本面因子"
name = "bp_lf"
direction = 1.0
weight = 1.0
availability_lag = 0

[[factors]]
source = "基本面因子"
name = "roe_ttm"
direction = 1.0
weight = 1.0
availability_lag = 0

[[factors]]
source = "低频量价"
name = "hist_vol_20d"
direction = -1.0
weight = 1.0
availability_lag = 0

[preprocess]
winsor_lower = 0.01
winsor_upper = 0.99
standardize = "zscore"       # zscore / rank / none; set preprocess.method for a full preprocessing plugin
neutralize_industry = true
neutralize_size = true
missing = "renormalize"      # renormalize / require_all
min_factor_count = 2

[combine]
method = "weighted"          # weighted / equal / rank_average / module:function

[selection]
method = "ic"                # ic / lasso / module:function
horizon = 20                 # Forward-return horizon in trading days for factor selection
min_coverage = 0.8
min_abs_rank_ic = 0.02
min_abs_t = 2.0
alpha = 0.02                 # Lasso penalty; a larger value retains fewer factors
tolerance = 1e-7
max_iter = 1000
coefficient_tolerance = 1e-10
top_n = 0                    # 0 means no limit; a positive value retains the N largest coefficients
ic_thresholds = [0.01, 0.02, 0.03]
alpha_grid = [0.01, 0.02, 0.05]
min_direction_stability = 0.6

[split]
method = "fixed"             # fixed / rolling
train_start = "2014-10-31"
train_end = "2019-04-30"    # First 4.5 years
validation_start = "2019-05-01"
validation_end = "2020-10-31" # Following 1.5 years
test_start = "2020-11-01"
test_end = "2023-10-31"     # Following 3 years; not read at this stage
live_start = "2023-11-01"
live_end = "2026-06-30"     # Remaining interval; not read at this stage

[rolling]
window = "expanding"        # expanding / sliding
train_months = 24            # Rolling validation runs only within the train + validation development interval
validation_months = 6
step_months = 6

[charts]
enabled = true               # Set false to disable charts
width = 1100
height = 500
# method = "your_module:your_function"  # Replace the entire charting method

[schedule]
method = "weekly"            # daily / weekly / monthly / quarterly / every_n_days
every_n_days = 5

[portfolio]
method = "benchmark_tilt"    # benchmark_tilt / top_n_equal / top_n_benchmark / module:function
empty_signal = "error"       # error / hold / cash
top_n = 100
tilt = 0.35
score_clip = 3.0
max_weight = 0.02

[execution]
price = "next_open"          # next_open / same_close
initial_cash = 100000000.0
record_positions = true
allow_same_close = false      # true acknowledges possible look-ahead bias in closing factors
allow_target_weight_above_one = true  # Preserve raw weights slightly above 100%; let the cash constraint handle execution

[rules]
profile = "custom"           # This supplied-weight backtest enables suspension restrictions only
block_suspended = true
block_limit = false
use_eod_limit_for_open = false
t_plus_one = false

[costs]
commission_rate = 0.0
minimum_commission = 0.0
stamp_tax = "none"
transfer_fee = "none"

[analytics]
horizons = [1, 5, 20]
quantiles = 5
annual_days = 252
risk_free_rate = 0.0
hac_lags = "auto"            # Newey-West lag order for overlapping returns; auto or a nonnegative integer

[output]
directory = "outputs/csi1000"
